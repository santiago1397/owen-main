# Call Monitoring Platform — conforms to ../../santiago/SERVER_SETUP.md.
# Native host Postgres (not containerized). No host ports — Traefik routes by label.
name: callmon

services:
  app:
    build: { context: ./backend, dockerfile: Dockerfile }
    image: callmon/app:latest
    container_name: callmon_app
    env_file: [.env.prod]
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach native Postgres on the host
    expose: ["8888"]
    volumes:
      - recordings:/data/recordings
      # Asterisk runs NATIVELY on the host and writes ARI recordings (voicemail, bridge
      # recordings) here. recording_fetch copies from ASTERISK_SPOOL_DIR into
      # RECORDINGS_DIR — read-only is enough, it never deletes the source.
      # Without this mount EVERY Asterisk recording fails to fetch. See asterisk/README.md.
      - /var/spool/asterisk/recording:/data/asterisk-spool:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [callmon-net, traefik-public]
    security_opt: ["no-new-privileges:true"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.callmon-api.rule=Host(`api.${APP_DOMAIN}`)"
      - "traefik.http.routers.callmon-api.entrypoints=websecure"
      - "traefik.http.routers.callmon-api.tls=true"
      - "traefik.http.routers.callmon-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.callmon-api.loadbalancer.server.port=8888"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }
        reservations: { cpus: '0.5', memory: 256M }

  worker:
    build: { context: ./backend, dockerfile: Dockerfile }
    image: callmon/app:latest
    container_name: callmon_worker
    command: ["python", "-m", "app.worker"]
    env_file: [.env.prod]
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - recordings:/data/recordings
      - /var/spool/asterisk/recording:/data/asterisk-spool:ro   # see app service above
    networks: [callmon-net]           # NOT traefik-public — no inbound routing
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  # AI voice-agent media service — see docs/AI_AGENT_SPEC.md (D2).
  # Deliberately its OWN container, not a thread in `worker`: the worker is capped at
  # 0.5 CPU / 256M and also runs the ARI consumer every live call depends on, so audio
  # work there would contend with — and could take down — call ingestion platform-wide.
  #
  # Currently the STEP 1 ECHO SPIKE: it proves audio round-trips and does nothing else.
  # Safe to leave stopped; nothing in app/worker/frontend references it.
  owen-voice:
    build: { context: ./owen-voice, dockerfile: Dockerfile }
    image: owen/voice:latest
    container_name: owen_voice
    env_file: [.env.prod]
    environment:
      - ENVIRONMENT=production
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach native Asterisk's ARI on the host
    ports:
      # Asterisk runs NATIVELY on the host and must dial IN to our AudioSocket listener
      # (ARI externalMedia connection_type=client), so this port cannot be `expose:`-only.
      # Bound to LOOPBACK, never 0.0.0.0 — the host reaches it, the internet cannot, and
      # no docker bridge IP is hardcoded anywhere (the 172.19.0.1 lesson from the Aug-2026
      # migration). VOICE_AUDIOSOCKET_ADVERTISE must match the left-hand side.
      - "127.0.0.1:9092:9092"
      # Control API, loopback too: curl it over the ssh session, never from the internet.
      - "127.0.0.1:8099:8099"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8099/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [callmon-net]           # NOT traefik-public — nothing here is publicly routed
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        # Sized for step 2 (STT/TTS clients + resampling), not the echo. The box has ~5.7
        # idle cores, so this is headroom, not a squeeze.
        limits: { cpus: '2', memory: 1G }
        reservations: { cpus: '0.25', memory: 128M }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: "https://api.${APP_DOMAIN}"
    image: callmon/frontend:latest
    container_name: callmon_frontend
    expose: ["3333"]
    networks: [traefik-public]
    security_opt: ["no-new-privileges:true"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.callmon-web.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.callmon-web.entrypoints=websecure"
      - "traefik.http.routers.callmon-web.tls=true"
      - "traefik.http.routers.callmon-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.callmon-web.loadbalancer.server.port=3333"
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128M }

networks:
  callmon-net: { driver: bridge }
  traefik-public: { name: traefik-public, external: true }

volumes:
  recordings:
