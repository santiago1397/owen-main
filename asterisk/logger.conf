; Asterisk logging — rendered to /etc/asterisk/logger.conf (see README.md).
;
; WHY THIS FILE EXISTS. The stock config logs only `notice,warning,error`, and Asterisk emits
; call setup at VERBOSE. The consequence, discovered the hard way while debugging a call that
; never arrived: an inbound INVITE — accepted or rejected — left NO trace whatsoever. The only
; way to tell whether a call had reached the box was `core show channels`' cumulative counter,
; which says a number and nothing else. You cannot debug "where did the call die" with that.
;
; So there is now a dedicated call log, and the answer to "did it even get here" is one grep.

[general]
; Timestamp every line. Correlating Asterisk against the containers' logs (which carry ISO
; timestamps from app/core/calllog.py) is the whole point, and it is impossible without this.
dateformat = %F %T.%3q

[logfiles]
; Unchanged: the operational log, kept quiet so a real problem still stands out.
console => notice,warning,error
messages.log => notice,warning,error

; The call log. `verbose` is what carries dialplan execution and Stasis entry — the lines that
; say a call arrived and where it went. `security` is what carries a REJECTED INVITE (failed
; identify/auth), which is the difference between "the carrier never sent it" and "we refused
; it" — the exact question that took an hour to answer without this.
;
; Rotate it: verbose on a busy trunk is not small. `logger rotate` is wired to logrotate below.
owen-calls.log => notice,warning,error,verbose,security
